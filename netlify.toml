# Netlify serves the built frontend from dist/ and runs the API (server/) as one function.
[build]
  # --include=dev: the build needs TypeScript and Vite even if NODE_ENV=production is set.
  command = "npm ci --include=dev && npm ci --prefix server && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "server/functions"
  node_bundler = "esbuild"

# The API function claims /api/* itself (config.path in server/functions/api.mjs), on the same domain as
# the site so the login cookie stays first-party. Function paths take precedence over the rule below.

# Single-page app: let React Router handle every other path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
